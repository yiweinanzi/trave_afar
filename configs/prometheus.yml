# =============================================================================
# Prometheus 配置
# =============================================================================

global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    cluster: 'goafar'
    environment: '${GOAFAR_ENV_MODE:dev}'

# 告警规则文件
rule_files:
  # - 'prometheus_rules.yml'

# 抓取配置
scrape_configs:
  # GoAfar API 指标
  - job_name: 'goafar-api'
    static_configs:
      - targets: ['goafar:8000']
        labels:
          service: 'goafar-api'
    metrics_path: '/metrics'
    scrape_interval: 10s

  # Prometheus 自身
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  # cAdvisor (容器指标)
  - job_name: 'cadvisor'
    static_configs:
      - targets: ['cadvisor:8080']
    # 需要 cadvisor 容器运行
