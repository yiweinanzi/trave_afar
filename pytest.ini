[pytest]
# Pytest configuration for GoAfar project

# Test discovery patterns
python_files = test_*.py *_test.py
python_classes = Test*
python_functions = test_*

# Minimum version
minversion = 7.0

# Output options (coverage is optional, requires pytest-cov)
addopts =
    -v
    --strict-markers
    --tb=short

# Coverage options (only used when --cov is specified)
# Run with: pytest --cov=src/embedding --cov=src/routing --cov-report=term-missing
# cov = src/
# cov_fail_under = 60

# Markers
markers =
    unit: Unit tests
    integration: Integration tests
    slow: Slow-running tests
    gpu: Tests requiring GPU
    requires_model: Tests requiring model files

# Test paths
testpaths = tests

# Logging
log_cli = true
log_cli_level = INFO
log_cli_format = %(asctime)s [%(levelname)8s] %(message)s
log_cli_date_format = %Y-%m-%d %H:%M:%S

# External warnings filtering
filterwarnings =
    ignore:.*joblib will operate in serial mode.*:UserWarning
    ignore:builtin type SwigPyPacked has no __module__ attribute:DeprecationWarning
    ignore:builtin type SwigPyObject has no __module__ attribute:DeprecationWarning
    ignore:builtin type swigvarlink has no __module__ attribute:DeprecationWarning

# Ignore paths
norecursedirs =
    .git
    .tox
    dist
    build
    *.egg-info
    open_resource
    models
    outputs

# Python paths
pythonpath = src
