planner_grpo:
  model_name: models/Qwen3-8B
  train_data: outputs/datasets/grpo_planner_prompts.jsonl
  val_data: outputs/datasets/grpo_planner_prompts.jsonl
  max_prompt_len: 1024
  max_response_len: 256

  # GRPO core
  group_n: 8
  adv_estimator: grpo
  clip_ratio: 0.2
  use_kl_loss: true
  kl_coef: 0.02
  loss_agg_mode: token_mean

  # rollout / optimization
  train_batch_size: 8
  micro_batch_size: 1
  gradient_accumulation_steps: 8
  lr: 1.0e-6
  epochs: 1
  temperature: 0.8
  top_p: 0.9

  # reward weights
  reward:
    pref_weight: 1.0
    feasible_penalty: 1.5
    overtime_penalty: 1.2
    travel_penalty: 0.003
    diversity_weight: 0.3
