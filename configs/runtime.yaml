runtime:
  seed: 2026
  log_level: INFO

paths:
  poi_csv: data/poi.csv
  user_events_csv: data/user_events.csv
  emb_dir: outputs/emb
  routing_dir: outputs/routing
  cache_dir: outputs/cache
  results_dir: outputs/results
  shp_dir: data/external/shengfen
  yelp_dir: data/external/yelp
  geolife_dir: data/external/Geolife Trajectories 1.3

# Qwen3系列模型配置（HF Mirror下载）
models:
  qwen_8b: models/Qwen3-8B
  qwen_embedding: models/Qwen3-Embedding-4B
  qwen_reranker: models/Qwen3-Reranker-4B
  bge_m3: models/Xorbits/bge-m3
  # 微调后的模型路径
  sft_model: outputs/sft/qwen3-8b-tourism
  dpo_model: outputs/dpo/qwen3-8b-dpo

embedding:
  model_path: models/Qwen3-Embedding-4B  # 使用Qwen3-Embedding-4B
  fallback_model: models/Xorbits/bge-m3  # 回退到BGE-M3
  use_gpu: true
  auto_build_if_missing: true
  backend: auto
  faiss_index_file: outputs/emb/poi_faiss.index

recall:
  semantic_topk: 80
  behavior_topk: 60
  geo_topk: 40
  final_topk: 80
  fusion: rrf
  rrf_k: 60
  dense_weight: 0.55
  behavior_weight: 0.30
  geo_weight: 0.15
  calibrate: minmax

  # RecBole 行为召回配置
  behavior_provider: popularity  # 可选: popularity, recbole
  recbole_model_path: outputs/recbole/saved  # RecBole 模型路径
  recbole_config: configs/recbole.yaml  # RecBole 配置文件
  recbole_use_gpu: true  # RecBole 是否使用 GPU

  # 动态权重融合
  adaptive_fusion: false  # 是否启用动态权重融合（根据用户历史长度调整）

rerank:
  enabled: true
  use_template: false  # 使用LLM重排序
  use_reranker_model: true  # 使用Qwen3-Reranker-4B
  qwen_reranker_path: models/Qwen3-Reranker-4B  # Reranker模型路径
  rerank_topk: 20  # Reranker精排后的Top-K数量
  topk: 30

planner:
  matrix_provider: auto
  osrm_url: http://router.project-osrm.org
  avg_speed_kmh: 55
  start_time_min: 480
  max_duration_hours: 10
  solve_time_limit_seconds: 25
  matrix_cache_ttl_hours: 24

llm:
  enabled: true  # 启用LLM功能
  mode: qwen  # 使用Qwen模型
  qwen_model: models/Qwen3-8B  # 主模型路径
  qwen_embedding_path: models/Qwen3-Embedding-4B  # Embedding模型路径
  qwen_reranker_path: models/Qwen3-Reranker-4B  # Reranker模型路径
  use_lora: false  # 是否使用LoRA适配器
  lora_path: null  # LoRA适配器路径
  use_gpu: true
  max_new_tokens: 512
  temperature: 0.7

# SFT/DPO训练配置
training:
  sft:
    output_dir: outputs/sft/qwen3-8b-tourism
    use_lora: true
    lora_r: 16
    lora_alpha: 16
    learning_rate: 2e-4
    num_epochs: 3
    batch_size: 2
    gradient_accumulation_steps: 4
    max_seq_length: 512
  dpo:
    output_dir: outputs/dpo/qwen3-8b-dpo
    use_lora: true
    learning_rate: 1e-5
    num_epochs: 1
    beta: 0.1
    max_length: 256

fallback:
  allow_without_embeddings: true
  min_candidates_for_planning: 5
  llm_to_template: true  # LLM失败时回退到模板
